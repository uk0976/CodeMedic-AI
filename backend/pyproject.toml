[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codemedic-ai-backend"
version = "0.1.0"
description = "CodeMedic AI backend foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.1",
  "fastapi>=0.115.8",
  "openai>=1.61.1",
  "psycopg[binary]>=3.2.4",
  "pydantic-settings>=2.7.1",
  "pwdlib[argon2]>=0.2.1",
  "PyJWT>=2.10.1",
  "reportlab>=5.0.0",
  "sqlalchemy>=2.0.37",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "black>=25.1.0",
  "flake8>=7.1.2",
  "httpx>=0.28.1",
  "isort>=6.0.0",
  "mypy>=1.14.1",
  "pytest>=8.3.4",
  "ruff>=0.9.4",
  "types-PyJWT>=1.7.1"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = false
warn_unused_ignores = false
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = ["jwt", "reportlab.*", "google.*", "google.generativeai.*", "pwdlib.*", "psycopg.*", "alembic.*"]
ignore_missing_imports = true
ignore_errors = true
